<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — BeautyBite</title>
    <link rel="icon" href="/logo2.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .cart-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 5rem;
        }
        .cart-title {
            font-family: var(--font-brand);
            font-size: 2rem;
            color: var(--navy);
            margin-bottom: 0.25rem;
        }
        .cart-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 820px) {
            .cart-layout { grid-template-columns: 1fr; }
        }

        /* ── Items panel ── */
        .cart-items-panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .cart-items-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .cart-item:last-child { border-bottom: none; }

        .item-left { display: flex; flex-direction: column; gap: 0.35rem; }
        .item-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--navy);
        }
        .item-meta {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .item-qty-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .qty-btn {
            width: 28px; height: 28px;
            border: 1px solid var(--border);
            background: var(--gray-50);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: var(--navy);
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            line-height: 1;
        }
        .qty-btn:hover:not(:disabled) { background: var(--brand-bg); border-color: var(--brand); }
        .qty-btn:disabled { opacity: 0.35; cursor: default; }
        .qty-val {
            min-width: 36px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--navy);
        }
        .item-remove {
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            margin-top: 0.25rem;
            width: fit-content;
        }
        .item-remove:hover { color: #e53e3e; }

        .item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
        }
        .item-total {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--navy);
        }
        .item-unit-price {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        /* empty state */
        .cart-empty {
            padding: 3.5rem 1.5rem;
            text-align: center;
        }
        .cart-empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.25;
        }
        .cart-empty h3 { color: var(--navy); margin-bottom: 0.5rem; }
        .cart-empty p  { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }

        /* ── Summary panel ── */
        .cart-summary-panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            position: sticky;
            top: 88px;
        }
        .summary-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--navy);
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .summary-row.total {
            border-bottom: none;
            border-top: 2px solid var(--border);
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--navy);
        }
        .summary-note {
            font-size: 0.76rem;
            color: var(--text-secondary);
            margin-top: 0.75rem;
            text-align: center;
        }
        .btn-checkout {
            display: block;
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.9rem 1rem;
            background: var(--brand-dark);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-checkout:hover { background: var(--navy); }
        .btn-checkout:disabled { opacity: 0.45; cursor: default; background: var(--brand); }
        .btn-keep-shopping {
            display: block;
            width: 100%;
            margin-top: 0.75rem;
            padding: 0.75rem 1rem;
            background: transparent;
            color: var(--brand-dark);
            border: 1.5px solid var(--brand);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-keep-shopping:hover { background: var(--brand-bg); }
        .btn-clear {
            display: block;
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.6rem 1rem;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.82rem;
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
        }
        .btn-clear:hover { color: #e53e3e; border-color: #e53e3e; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">
        <img src="/logo2.webp" alt="Beauty Bite" style="height:40px;width:auto;border-radius:10px;display:block;">
    </a>
    <ul class="navbar-nav">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/shop" class="nav-link">Shop</a></li>
        <li><a href="/design-studio" class="nav-link">Design Studio</a></li>
        <li><a href="/login" class="nav-link">Login</a></li>
    </ul>
    <div class="navbar-actions">
        <a href="/shop" class="btn btn-primary btn-sm">Order Now</a>
    </div>
</nav>

<div class="cart-wrap">
    <h1 class="cart-title">Your Cart</h1>
    <p class="cart-subtitle" id="cart-subtitle">Loading…</p>

    <div class="cart-layout">
        <!-- Items -->
        <div class="cart-items-panel">
            <div class="cart-items-header">Items</div>
            <div id="cart-items-body"></div>
        </div>

        <!-- Summary -->
        <div class="cart-summary-panel">
            <div class="summary-title">Order Summary</div>
            <div class="summary-row"><span>Subtotal</span><span id="s-subtotal">—</span></div>
            <div class="summary-row"><span>Tax (8.5%)</span><span id="s-tax">—</span></div>
            <div class="summary-row"><span>Shipping</span><span id="s-shipping">—</span></div>
            <div class="summary-row total"><span>Total</span><span id="s-total">—</span></div>
            <p class="summary-note">Free shipping on orders $100+</p>
            <button class="btn-checkout" id="btn-checkout" disabled>Proceed to Checkout</button>
            <a href="/shop" class="btn-keep-shopping">Continue Shopping</a>
            <button class="btn-clear" id="btn-clear">Clear cart</button>
        </div>
    </div>
</div>

<script src="/js/products.js"></script>
<script src="/js/header-init.js"></script>
<script>
(function () {
    const CART_KEY = 'beautybite_cart';
    const TAX = 0.085;
    const FREE_SHIP_MIN = 100;
    const SHIP_FLAT = 9.99;

    function fmt(n) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n || 0);
    }

    function loadCart() {
        try { return JSON.parse(localStorage.getItem(CART_KEY)) || { items: [] }; } catch (_) { return { items: [] }; }
    }

    function saveCart(cart) {
        cart.lastUpdated = new Date().toISOString();
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        window.dispatchEvent(new StorageEvent('storage', { key: CART_KEY }));
        document.dispatchEvent(new CustomEvent('beautybite:cart-changed'));
    }

    function totals(items) {
        const subtotal = items.reduce((s, it) => s + (it.priceInfo ? it.priceInfo.subtotal : 0), 0);
        const tax = subtotal * TAX;
        const shipping = subtotal === 0 ? 0 : subtotal >= FREE_SHIP_MIN ? 0 : SHIP_FLAT;
        return { subtotal, tax, shipping, total: subtotal + tax + shipping };
    }

    function render() {
        const cart = loadCart();
        const items = cart.items || [];
        const body = document.getElementById('cart-items-body');
        const subtitle = document.getElementById('cart-subtitle');
        const btnCheckout = document.getElementById('btn-checkout');
        const t = totals(items);

        // subtitle
        const count = items.reduce((s, it) => s + (it.quantity || 0), 0);
        subtitle.textContent = count === 0 ? 'Your cart is empty.' : `${count} item${count !== 1 ? 's' : ''} in your cart`;

        // checkout button
        btnCheckout.disabled = items.length === 0;

        // totals
        document.getElementById('s-subtotal').textContent = fmt(t.subtotal);
        document.getElementById('s-tax').textContent = fmt(t.tax);
        document.getElementById('s-shipping').textContent = t.subtotal === 0 ? '—' : t.shipping === 0 ? 'Free' : fmt(t.shipping);
        document.getElementById('s-total').textContent = fmt(t.total);

        // items
        if (items.length === 0) {
            body.innerHTML = `
                <div class="cart-empty">
                    <div class="cart-empty-icon">🛒</div>
                    <h3>Nothing here yet</h3>
                    <p>Add products from the shop to get started.</p>
                    <a href="/shop" class="btn btn-brand btn-sm">Browse Products</a>
                </div>`;
            return;
        }

        body.innerHTML = items.map((item, idx) => {
            const product = window.productCatalog ? window.productCatalog.getProduct(item.productId) : null;
            const name = product ? product.name : (item.productName || item.productId);
            const unitPrice = item.priceInfo ? item.priceInfo.unitPrice : 0;
            const subtotal = item.priceInfo ? item.priceInfo.subtotal : 0;
            const min = product ? (product.minQuantity || 1) : 1;
            const max = product ? (product.maxQuantity || 99999) : 99999;
            const optLabel = item.purchasingOption === 'subscription' ? 'Monthly Supply' : 'One-time order';
            return `
            <div class="cart-item">
                <div class="item-left">
                    <div class="item-name">${name}</div>
                    <div class="item-meta">${optLabel}</div>
                    <div class="item-qty-row">
                        <button class="qty-btn" onclick="changeQty(${idx}, ${item.quantity - 1})" ${item.quantity <= min ? 'disabled' : ''}>−</button>
                        <span class="qty-val">${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${idx}, ${item.quantity + 1})" ${item.quantity >= max ? 'disabled' : ''}>+</button>
                        <span style="font-size:0.78rem;color:var(--text-secondary);margin-left:0.25rem;">units</span>
                    </div>
                    <button class="item-remove" onclick="removeItem(${idx})">Remove</button>
                </div>
                <div class="item-right">
                    <div class="item-total">${fmt(subtotal)}</div>
                    <div class="item-unit-price">${fmt(unitPrice)} / unit</div>
                </div>
            </div>`;
        }).join('');
    }

    window.changeQty = function (idx, newQty) {
        const cart = loadCart();
        const item = cart.items[idx];
        if (!item) return;
        const product = window.productCatalog ? window.productCatalog.getProduct(item.productId) : null;
        const min = product ? (product.minQuantity || 1) : 1;
        const max = product ? (product.maxQuantity || 99999) : 99999;
        if (newQty < min || newQty > max) return;
        item.quantity = newQty;
        if (window.productCatalog) {
            item.priceInfo = window.productCatalog.calculatePrice(item.productId, newQty, item.purchasingOption);
        } else if (item.priceInfo) {
            item.priceInfo.subtotal = item.priceInfo.unitPrice * newQty;
            item.priceInfo.quantity = newQty;
        }
        saveCart(cart);
        render();
    };

    window.removeItem = function (idx) {
        const cart = loadCart();
        cart.items.splice(idx, 1);
        saveCart(cart);
        render();
    };

    document.getElementById('btn-clear').addEventListener('click', function () {
        if (!confirm('Clear your entire cart?')) return;
        saveCart({ items: [] });
        render();
    });

    document.getElementById('btn-checkout').addEventListener('click', function () {
        window.location.href = '/checkout';
    });

    document.addEventListener('DOMContentLoaded', render);
    window.addEventListener('storage', function (e) { if (e.key === CART_KEY) render(); });
})();
</script>
</body>
</html>
