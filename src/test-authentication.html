<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBite - Authentication Test</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Include Header with Authentication -->
    <div id="header-container"></div>

    <main>
        <section class="hero" style="padding: 100px 0; text-align: center;">
            <div class="container">
                <h1>Authentication Test</h1>
                <p>Test the complete authentication flow including login, registration, and session management.</p>

                <div class="test-controls" style="margin: 40px 0;">
                    <div class="test-buttons"
                        style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                        <button id="testLogin" class="btn" style="background: var(--accent-teal);">Test Login</button>
                        <button id="testRegister" class="btn" style="background: var(--accent-blue);">Test
                            Registration</button>
                        <button id="testLogout" class="btn" style="background: var(--accent-red);">Test Logout</button>
                        <button id="testToken" class="btn" style="background: var(--accent-orange);">Check Token
                            Status</button>
                        <button id="testCart" class="btn" style="background: var(--accent-purple);">Test Cart</button>
                    </div>
                </div>

                <div class="test-results"
                    style="background: white; padding: 30px; border-radius: 12px; box-shadow: var(--shadow-1); max-width: 800px; margin: 0 auto;">
                    <h3>Test Results</h3>
                    <div id="testOutput"
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px; min-height: 200px; font-family: monospace; white-space: pre-wrap; text-align: left;">
                    </div>
                </div>

                <div class="auth-status" style="margin-top: 40px;">
                    <h3>Current Authentication Status</h3>
                    <div id="authStatus"
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px;"></div>
                </div>

                <div class="cart-status" style="margin-top: 40px;">
                    <h3>Cart Status</h3>
                    <div id="cartStatus"
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px;"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Load header and initialize authentication
        document.addEventListener('DOMContentLoaded', function () {
            loadHeader();
        });

        async function loadHeader() {
            try {
                const response = await fetch('header.html');
                if (!response.ok) throw new Error('Failed to load header');

                const headerHtml = await response.text();
                document.getElementById('header-container').innerHTML = headerHtml;

                // Initialize authentication and cart after header is loaded
                initializePageAfterHeader();
            } catch (error) {
                console.error('Error loading header:', error);
                createFallbackHeader();
            }
        }

        function initializePageAfterHeader() {
            // Load AuthManager if not already loaded
            if (typeof AuthManager === 'undefined') {
                const authScript = document.createElement('script');
                authScript.src = 'js/auth.js';
                authScript.onload = () => {
                    // Load CartManager after AuthManager
                    const cartScript = document.createElement('script');
                    cartScript.src = 'js/shop.js';
                    cartScript.onload = initTestPage;
                    document.head.appendChild(cartScript);
                };
                document.head.appendChild(authScript);
            } else {
                // Load CartManager if AuthManager is already loaded
                if (typeof CartManager === 'undefined') {
                    const cartScript = document.createElement('script');
                    cartScript.src = 'js/shop.js';
                    cartScript.onload = initTestPage;
                    document.head.appendChild(cartScript);
                } else {
                    initTestPage();
                }
            }
        }

        function createFallbackHeader() {
            const headerContainer = document.getElementById('header-container');
            headerContainer.innerHTML = `
                <header>
                    <div class="header-container">
                        <div class="logo-section">
                            <h1 class="site-title"><a href="index.html" style="text-decoration: none; color: inherit;">BeautyBite</a></h1>
                        </div>
                        <nav>
                            <ul>
                                <li><a href="index.html">Home</a></li>
                                <li><a href="test-authentication.html">Auth Test</a></li>
                            </ul>
                        </nav>
                    </div>
                </header>
            `;
        }

        function initTestPage() {
            // Set up test buttons
            document.getElementById('testLogin').addEventListener('click', testLogin);
            document.getElementById('testRegister').addEventListener('click', testRegister);
            document.getElementById('testLogout').addEventListener('click', testLogout);
            document.getElementById('testToken').addEventListener('click', testTokenStatus);
            document.getElementById('testCart').addEventListener('click', testCart);

            // Update initial status displays
            updateAuthStatus();
            updateCartStatus();

            console.log('Authentication test page initialized');
        }

        function logTest(message) {
            const output = document.getElementById('testOutput');
            output.textContent += new Date().toLocaleTimeString() + ' - ' + message + '\n';
            output.scrollTop = output.scrollHeight;
        }

        function updateAuthStatus() {
            const statusElement = document.getElementById('authStatus');

            if (typeof AuthManager !== 'undefined') {
                const isAuthenticated = AuthManager.isAuthenticated;
                const user = AuthManager.currentUser;
                const token = AuthManager.getToken();

                statusElement.innerHTML = `
                    <p><strong>Authenticated:</strong> ${isAuthenticated ? 'Yes' : 'No'}</p>
                    <p><strong>User:</strong> ${user ? JSON.stringify(user, null, 2) : 'None'}</p>
                    <p><strong>Token Present:</strong> ${token ? 'Yes' : 'No'}</p>
                    <p><strong>Token Expired:</strong> ${token ? (AuthManager.isTokenExpired() ? 'Yes' : 'No') : 'N/A'}</p>
                `;
            } else {
                statusElement.innerHTML = '<p>AuthManager not loaded</p>';
            }
        }

        function updateCartStatus() {
            const statusElement = document.getElementById('cartStatus');

            if (typeof CartManager !== 'undefined') {
                const cartSummary = CartManager.getCartSummary();

                statusElement.innerHTML = `
                    <p><strong>Total Items:</strong> ${cartSummary.totalItems}</p>
                    <p><strong>Total Price:</strong> $${cartSummary.totalPrice.toFixed(2)}</p>
                    <p><strong>Items:</strong> ${JSON.stringify(cartSummary.items, null, 2)}</p>
                `;
            } else {
                statusElement.innerHTML = '<p>CartManager not loaded</p>';
            }
        }

        async function testLogin() {
            logTest('Testing login...');

            if (typeof AuthManager === 'undefined') {
                logTest('ERROR: AuthManager not loaded');
                return;
            }

            // Test with demo credentials (these should match your backend test data)
            const email = 'demo@beautybite.com';
            const password = 'demo123';
            const rememberMe = true;

            try {
                const result = await AuthManager.login(email, password, rememberMe);

                if (result.success) {
                    logTest('SUCCESS: Login successful');
                    logTest(`User: ${result.user.firstName} ${result.user.lastName}`);
                } else {
                    logTest(`ERROR: ${result.error}`);
                }
            } catch (error) {
                logTest(`ERROR: ${error.message}`);
            }

            updateAuthStatus();
        }

        async function testRegister() {
            logTest('Testing registration...');

            if (typeof AuthManager === 'undefined') {
                logTest('ERROR: AuthManager not loaded');
                return;
            }

            // Generate unique test data
            const timestamp = Date.now();
            const userData = {
                firstName: 'Test',
                lastName: `User${timestamp}`,
                email: `test${timestamp}@beautybite.com`,
                phone: '+1-555-0123',
                password: 'TestPassword123',
                confirmPassword: 'TestPassword123'
            };

            try {
                const result = await AuthManager.register(userData);

                if (result.success) {
                    logTest('SUCCESS: Registration successful');
                    logTest(`User created: ${result.user.email}`);
                } else {
                    logTest(`ERROR: ${result.error}`);
                }
            } catch (error) {
                logTest(`ERROR: ${error.message}`);
            }

            updateAuthStatus();
        }

        async function testLogout() {
            logTest('Testing logout...');

            if (typeof AuthManager === 'undefined') {
                logTest('ERROR: AuthManager not loaded');
                return;
            }

            try {
                await AuthManager.logout();
                logTest('SUCCESS: Logout completed');
            } catch (error) {
                logTest(`ERROR: ${error.message}`);
            }

            updateAuthStatus();
        }

        function testTokenStatus() {
            logTest('Checking token status...');

            if (typeof AuthManager === 'undefined') {
                logTest('ERROR: AuthManager not loaded');
                return;
            }

            const token = AuthManager.getToken();
            const userData = AuthManager.getStoredUserData();
            const isExpired = AuthManager.isTokenExpired();

            logTest(`Token: ${token ? 'Present' : 'Missing'}`);
            logTest(`Token Expired: ${isExpired}`);
            logTest(`User Data: ${userData ? 'Present' : 'Missing'}`);
            logTest(`Auth Status: ${AuthManager.isAuthenticated ? 'Authenticated' : 'Not Authenticated'}`);

            updateAuthStatus();
        }

        function testCart() {
            logTest('Testing cart functionality...');

            if (typeof CartManager === 'undefined') {
                logTest('ERROR: CartManager not loaded');
                return;
            }

            // Test adding an item to cart
            const testProduct = {
                id: 'test-product-1',
                name: 'Test Product',
                price: 99.99,
                image: 'test-image.jpg'
            };

            const success = CartManager.addToCart(testProduct, 2);

            if (success) {
                logTest('SUCCESS: Item added to cart');
            } else {
                logTest('ERROR: Failed to add item to cart');
            }

            updateCartStatus();
        }

        // Make showNotification function globally available
        window.showNotification = function (message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.textContent = message;

            // Style the notification
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;

            if (type === 'success') {
                notification.style.background = 'var(--accent-teal)';
            } else if (type === 'error') {
                notification.style.background = 'var(--accent-red)';
            } else {
                notification.style.background = 'var(--accent-blue)';
            }

            // Add to page
            document.body.appendChild(notification);

            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        };
    </script>
</body>

</html>
