<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — BeautyBite</title>
    <link rel="icon" href="/logo2.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            color: #1A202C;
            min-height: 100vh;
        }

        /* ── Nav ── */
        .checkout-nav {
            background: #1B2D3E;
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .checkout-nav-brand {
            font-family: 'Pacifico', cursive;
            color: #14B8A6;
            font-size: 1.4rem;
            text-decoration: none;
        }
        .checkout-nav-steps {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
        }
        .checkout-nav-steps .step-active {
            color: #14B8A6;
            font-weight: 600;
        }

        /* ── Layout ── */
        .checkout-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 2rem;
            align-items: start;
        }

        /* ── Cards ── */
        .checkout-card {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 2rem;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1B2D3E;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
            letter-spacing: -0.01em;
        }

        /* ── Order summary ── */
        .order-product-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .order-preview-canvas {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            background: #0a1929;
            flex-shrink: 0;
        }
        .order-preview-canvas canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .order-product-info {
            flex: 1;
        }
        .order-product-name {
            font-weight: 700;
            font-size: 1rem;
            color: #1B2D3E;
            margin-bottom: 0.25rem;
        }
        .order-tier-badge {
            display: inline-block;
            background: #e0f7fa;
            color: #0e7490;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .order-line-items {
            margin-top: 1rem;
        }
        .order-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #64748b;
            padding: 0.4rem 0;
        }
        .order-line.total {
            border-top: 1px solid #e2e8f0;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: #1B2D3E;
        }
        .order-line.total span:last-child {
            color: #14B8A6;
        }

        /* ── Form ── */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #1A202C;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #14B8A6;
            box-shadow: 0 0 0 3px rgba(20,184,166,0.12);
        }

        /* ── Stripe card element ── */
        .stripe-card-wrapper {
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 1rem;
        }
        .stripe-card-wrapper.focused {
            border-color: #14B8A6;
            box-shadow: 0 0 0 3px rgba(20,184,166,0.12);
        }

        /* ── Submit button ── */
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: #14B8A6;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            margin-top: 0.5rem;
        }
        .submit-btn:hover:not(:disabled) {
            background: #0e9c8f;
            box-shadow: 0 4px 16px rgba(20,184,166,0.3);
        }
        .submit-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ── Security badge ── */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .security-badge svg {
            color: #94a3b8;
        }

        /* ── Error ── */
        .payment-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .checkout-wrapper {
                grid-template-columns: 1fr;
                padding: 1.5rem 1rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="nav-root"></div>
<script src="/js/header-init.js"></script>

<nav class="checkout-nav">
    <a href="/" class="checkout-nav-brand">Beauty Bite</a>
    <div class="checkout-nav-steps">
        <span>Cart</span>
        <span style="margin:0 0.25rem;">›</span>
        <span class="step-active">Payment</span>
        <span style="margin:0 0.25rem;">›</span>
        <span>Confirmation</span>
    </div>
</nav>

<div class="checkout-wrapper">

    <!-- LEFT: Order summary + 3D preview -->
    <div class="checkout-card">
        <div class="card-title">Order Summary</div>

        <div class="order-product-row">
            <div class="order-preview-canvas">
                <canvas id="checkout-preview-canvas" width="80" height="80"></canvas>
            </div>
            <div class="order-product-info">
                <div class="order-product-name" id="order-product-name">BeautyBite</div>
                <div class="order-tier-badge" id="order-tier-badge">Branded</div>
            </div>
        </div>

        <div class="order-line-items">
            <div class="order-line">
                <span>Unit price</span>
                <span id="order-unit-price">—</span>
            </div>
            <div class="order-line">
                <span>Quantity</span>
                <span id="order-quantity">—</span>
            </div>
            <div class="order-line total">
                <span>Total</span>
                <span id="order-total">—</span>
            </div>
        </div>
    </div>

    <!-- RIGHT: Payment form -->
    <div class="checkout-card">
        <div class="card-title">Payment Details</div>

        <div class="payment-error" id="payment-error"></div>

        <form id="checkout-form">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="checkout-name">Full Name</label>
                    <input type="text" id="checkout-name" class="form-input" placeholder="Jane Smith" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="checkout-email">Email</label>
                    <input type="email" id="checkout-email" class="form-input" placeholder="jane@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Card Details</label>
                <div class="stripe-card-wrapper" id="card-element-wrapper">
                    <div id="card-element"></div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Complete Order</button>
        </form>

        <div class="security-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Secured by Stripe
        </div>
    </div>

</div>

<script>
async function initCheckout() {
    const token = localStorage.getItem('bb_token');

    // Parse config from URL
    const params = new URLSearchParams(window.location.search);
    let config = {};
    try { config = JSON.parse(decodeURIComponent(params.get('config') || '{}')); } catch(e) {}

    // Show product info
    const productNames = {
        'beautybite-branded': 'BeautyBite Branded',
        'clear-bulk': 'Clear Classic',
        'custom-branded': 'Custom Design'
    };
    const tierLabels = {
        'beautybite-branded': 'Tier 2 — Branded',
        'clear-bulk': 'Tier 1 — Bulk',
        'custom-branded': 'Tier 3 — Custom'
    };
    const qty = config.quantity || 1;
    const unitPrice = config.unitPrice || 200;
    const productId = config.productId || 'beautybite-branded';

    document.getElementById('order-product-name').textContent = productNames[productId] || 'BeautyBite';
    document.getElementById('order-tier-badge').textContent = tierLabels[productId] || 'Branded';
    document.getElementById('order-quantity').textContent = qty + (qty === 1 ? ' unit' : ' units');
    document.getElementById('order-unit-price').textContent = '$' + unitPrice.toFixed(2);
    document.getElementById('order-total').textContent = '$' + (qty * unitPrice).toFixed(2);

    // Draw 2D preview canvas fallback
    (function drawPreview() {
        const canvas = document.getElementById('checkout-preview-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const palettes = {
            'clear-bulk':         { bg: '#0a1929', outer: 'rgba(140,210,255,0.82)', edge: '#44aaff' },
            'beautybite-branded': { bg: '#081422', outer: '#2B5C8E',               edge: '#14B8A6' },
            'custom-branded':     { bg: '#080f1e', outer: '#0066CC',               edge: '#f59e0b' }
        };
        const p = palettes[productId] || palettes['beautybite-branded'];
        const w = 80, h = 80;
        ctx.fillStyle = p.bg;
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        ctx.fillStyle = p.outer;
        ctx.shadowColor = p.edge;
        ctx.shadowBlur = 8;
        const cx = w/2, cy = h*0.5, ow = w*0.72, oh = h*0.6, iw = w*0.48, ih = h*0.38, bot = h*0.82;
        ctx.beginPath();
        ctx.moveTo(cx-ow/2,cy);
        ctx.bezierCurveTo(cx-ow/2,cy-oh*0.5,cx+ow/2,cy-oh*0.5,cx+ow/2,cy);
        ctx.bezierCurveTo(cx+ow/2,cy+oh*0.3,cx+ow/2*0.85,bot,cx,bot);
        ctx.bezierCurveTo(cx-ow/2*0.85,bot,cx-ow/2,cy+oh*0.3,cx-ow/2,cy);
        ctx.closePath();
        ctx.moveTo(cx-iw/2,cy+(oh-ih)*0.1);
        ctx.bezierCurveTo(cx-iw/2,cy-ih*0.4,cx+iw/2,cy-ih*0.4,cx+iw/2,cy+(oh-ih)*0.1);
        ctx.bezierCurveTo(cx+iw/2,cy+ih*0.4,cx+iw/2*0.8,bot-h*0.08,cx,bot-h*0.08);
        ctx.bezierCurveTo(cx-iw/2*0.8,bot-h*0.08,cx-iw/2,cy+ih*0.4,cx-iw/2,cy+(oh-ih)*0.1);
        ctx.closePath();
        ctx.fill('evenodd');
        ctx.restore();
        ctx.strokeStyle = p.edge;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx-ow/2,cy);
        ctx.bezierCurveTo(cx-ow/2,cy-oh*0.5,cx+ow/2,cy-oh*0.5,cx+ow/2,cy);
        ctx.bezierCurveTo(cx+ow/2,cy+oh*0.3,cx+ow/2*0.85,bot,cx,bot);
        ctx.bezierCurveTo(cx-ow/2*0.85,bot,cx-ow/2,cy+oh*0.3,cx-ow/2,cy);
        ctx.closePath();
        ctx.moveTo(cx-iw/2,cy+(oh-ih)*0.1);
        ctx.bezierCurveTo(cx-iw/2,cy-ih*0.4,cx+iw/2,cy-ih*0.4,cx+iw/2,cy+(oh-ih)*0.1);
        ctx.bezierCurveTo(cx+iw/2,cy+ih*0.4,cx+iw/2*0.8,bot-h*0.08,cx,bot-h*0.08);
        ctx.bezierCurveTo(cx-iw/2*0.8,bot-h*0.08,cx-iw/2,cy+ih*0.4,cx-iw/2,cy+(oh-ih)*0.1);
        ctx.closePath();
        ctx.stroke();
    })();

    // Pre-fill email from stored user if available
    try {
        const stored = localStorage.getItem('bb_user');
        if (stored) {
            const u = JSON.parse(stored);
            if (u.email) document.getElementById('checkout-email').value = u.email;
            if (u.name) document.getElementById('checkout-name').value = u.name;
        }
    } catch(e) {}

    // Init Stripe
    let stripe, cardElement;
    try {
        const keyRes = await fetch('/api/config/stripe-publishable-key');
        const { publishableKey } = await keyRes.json();
        stripe = Stripe(publishableKey);
        const elements = stripe.elements();
        cardElement = elements.create('card', {
            style: {
                base: {
                    fontFamily: 'Inter, sans-serif',
                    fontSize: '16px',
                    color: '#1A202C',
                    '::placeholder': { color: '#A0AEC0' }
                }
            }
        });
        cardElement.mount('#card-element');
        cardElement.on('focus', () => document.getElementById('card-element-wrapper').classList.add('focused'));
        cardElement.on('blur', () => document.getElementById('card-element-wrapper').classList.remove('focused'));
    } catch(err) {
        console.error('Stripe init failed:', err);
        document.getElementById('payment-error').textContent = 'Payment system unavailable. Please try again.';
        document.getElementById('payment-error').style.display = 'block';
    }

    document.getElementById('checkout-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Processing...';
        document.getElementById('payment-error').style.display = 'none';

        try {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;

            const sessionRes = await fetch('/api/stripe/create-checkout-session', {
                method: 'POST',
                headers,
                body: JSON.stringify({
                    productId: productId,
                    quantity: qty,
                    purchaseType: 'oneTime'
                })
            });
            const { url, error } = await sessionRes.json();
            if (error) throw new Error(error);
            if (url) {
                window.location.href = url;
            } else {
                throw new Error('No redirect URL returned from server.');
            }
        } catch(err) {
            document.getElementById('payment-error').textContent = err.message || 'Payment failed. Please try again.';
            document.getElementById('payment-error').style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Complete Order';
        }
    });
}

document.addEventListener('DOMContentLoaded', initCheckout);
</script>

</body>
</html>
