<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBite Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body.gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }

        .user-name {
            font-weight: 600;
            font-size: 1.2em;
        }

        #logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        #logout:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .product-card img {
            width: 100%;
            max-width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .product-card h2 {
            font-size: 1.5em;
            margin: 10px 0;
            font-weight: 600;
        }

        .price {
            font-size: 2em;
            font-weight: 700;
            color: #FFD700;
            margin: 10px 0;
        }

        .product-card label {
            display: block;
            margin: 20px 0;
            font-weight: 600;
        }

        .product-card input[type="number"] {
            width: 120px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            text-align: center;
        }

        .product-card button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .product-card button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 600;
            display: block;
            margin-bottom: 20px;
        }

        .footer a:hover {
            color: white;
        }

        #payment-section {
            display: none;
            max-width: 500px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #payment-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        #payment-details {
            color: #333;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
        }

        #payment-element {
            margin: 20px 0;
        }

        #submit-payment {
            margin-top: 20px;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #submit-payment:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        #submit-payment:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #payment-message {
            margin-top: 15px;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
        }

        #payment-message.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        #payment-message.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        #cancel-payment {
            margin-top: 15px;
            width: 100%;
            background: rgba(0, 0, 0, 0.1);
            color: #333;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .products {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 15px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body class="gradient-bg">
    <div class="header">
        <h1>BeautyBite Shop</h1>
        <span class="user-name">Guest</span>
        <button id="logout">Logout</button>
    </div>
    <main>
        <section class="products" id="products-section">
            <div class="product-card">
                <img src="https://placehold.co/300x200/667eea/ffffff?text=Mouthguard" alt="BeautyBite Mouthguard">
                <h2>BeautyBite Mouthguard - One-Time</h2>
                <p class="price">$200</p>
                <label>Quantity (1-10,000):
                    <input type="number" id="qty-one" min="1" max="10000" value="1">
                </label>
                <button id="buy-now">Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://placehold.co/300x200/764ba2/ffffff?text=Recurring+Order"
                    alt="BeautyBite Recurring Order">
                <h2>BeautyBite Recurring Order</h2>
                <p class="price">$200/mouthguard</p>
                <label>Mouthguards per month (1-1,000):
                    <input type="number" id="qty-recurring" min="1" max="1000" value="1">
                </label>
                <label>Duration (1-36 months):
                    <input type="number" id="months" min="1" max="36" value="1">
                </label>
                <button id="recurring-now">Order Now</button>
            </div>
            <div class="product-card">
                <h2>BeautyBite Subscription</h2>
                <p class="price">$200/mouthguard</p>

                <label>Quantity per period (1-1,000):
                    <input type="number" id="sub-quantity" min="1" max="1000" value="5">
                </label>

                <label>Billing interval:
                    <select id="sub-interval">
                        <option value="12hour">Every 12 Hours (Testing)</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly" selected>Monthly</option>
                    </select>
                </label>

                <label>Duration (1-36 periods):
                    <input type="number" id="sub-duration" min="1" max="36" value="12">
                </label>

                <div id="subscription-summary"></div>

                <div id="sub-payment-element" style="display: none;"></div>
                <div id="sub-payment-status" style="min-height: 20px;"></div>
                <button id="subscribe-now" type="button">Subscribe Now</button>
            </div>
        </section>

        <!-- Payment Section (hidden by default) -->
        <div id="payment-section">
            <h2>Complete Payment</h2>
            <div id="payment-details"></div>

            <!-- Stripe Payment Element will mount here -->
            <form id="payment-form">
                <div id="payment-element"></div>
                <button type="submit" id="submit-payment">Pay Now</button>
                <div id="payment-message"></div>
            </form>

            <button id="cancel-payment">Cancel</button>
        </div>
    </main>
    <div class="footer">
        <a href="orders.html">View Orders</a>
    </div>
    <script>
        // Always use Heroku backend
        const API_BASE = 'https://beautybite-36e5434be6c8.herokuapp.com';
        const token = localStorage.getItem('token');

        // Check authentication
        let user = {};
        try {
            user = JSON.parse(localStorage.getItem('user') || '{}');
        } catch (e) {
            console.error('Error parsing user data:', e);
        }

        if (!token) {
            console.log('No token found, redirecting to login');
            window.location.href = 'login.html';
        }

        document.querySelector('.user-name').textContent = user.name || 'User';
        document.getElementById('logout').onclick = () => {
            localStorage.clear();
            location.href = 'login.html';
        };

        // Initialize Stripe
        let stripe, elements, clientSecret, currentOrderType;
        stripe = Stripe('pk_test_51SU97uGiZtqZsqe8gZyp6Y1HyBdqlUHqNbukme3En5TRj8YVEXXoUwEv9dGIDt62hFybhy2qdJ7zvYfKYqC8nPug00EinP5Wp9');

        // Buy Now button (one-time purchase)
        document.getElementById('buy-now').onclick = async () => {
            const quantity = parseInt(document.getElementById('qty-one').value);

            // Validate quantity
            if (!quantity || quantity < 1 || quantity > 10000) {
                alert('Please enter a valid quantity (1-10,000)');
                return;
            }

            await createPayment('one-time', quantity, 1);
        };

        // Recurring Order button
        document.getElementById('recurring-now').onclick = async () => {
            const quantity = parseInt(document.getElementById('qty-recurring').value);
            const months = parseInt(document.getElementById('months').value);

            // Validate inputs
            if (!quantity || quantity < 1 || quantity > 1000) {
                alert('Please enter a valid quantity per month (1-1,000)');
                return;
            }
            if (!months || months < 1 || months > 36) {
                alert('Please enter a valid duration (1-36 months)');
                return;
            }

            await createPayment('recurring', quantity, months);
        };

        async function createPayment(orderType, quantity, months) {
            currentOrderType = orderType;

            try {
                // Create PaymentIntent
                const res = await fetch(`${API_BASE}/api/stripe/create-payment-intent`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        orderType: orderType,
                        quantity: quantity,
                        months: months
                    })
                });

                const data = await res.json();

                if (!data.clientSecret) {
                    alert('Error: ' + (data.error || 'Failed to create payment'));
                    return;
                }

                clientSecret = data.clientSecret;

                // Calculate total
                const totalAmount = quantity * months * 200;

                // Show payment section
                if (orderType === 'one-time') {
                    document.getElementById('payment-details').innerHTML = `
                        <strong>Product:</strong> BeautyBite Mouthguard<br>
                        <strong>Quantity:</strong> ${quantity}<br>
                        <strong>Total:</strong> $${totalAmount.toLocaleString()}
                    `;
                } else {
                    document.getElementById('payment-details').innerHTML = `
                        <strong>Product:</strong> Recurring Order<br>
                        <strong>Quantity per month:</strong> ${quantity} mouthguards<br>
                        <strong>Duration:</strong> ${months} months<br>
                        <strong>Total (Pay upfront):</strong> $${totalAmount.toLocaleString()}
                    `;
                }

                document.getElementById('payment-section').style.display = 'block';
                document.getElementById('products-section').style.display = 'none';

                // Initialize Payment Element
                const appearance = { theme: 'stripe' };
                elements = stripe.elements({ clientSecret, appearance });
                const paymentElement = elements.create('payment');
                paymentElement.mount('#payment-element');

            } catch (e) {
                console.error('Payment setup error:', e);
                alert('Error: ' + e.message);
            }
        }

        // Handle payment form submission
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitButton = document.getElementById('submit-payment');
            const messageDiv = document.getElementById('payment-message');

            submitButton.disabled = true;
            submitButton.textContent = 'Processing...';
            messageDiv.textContent = '';
            messageDiv.className = '';

            try {
                // Confirm payment
                const { error, paymentIntent } = await stripe.confirmPayment({
                    elements,
                    redirect: 'if_required'
                });

                if (error) {
                    messageDiv.textContent = error.message;
                    messageDiv.className = 'error';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Pay Now';
                } else if (paymentIntent && paymentIntent.status === 'succeeded') {
                    // Save order to database
                    await fetch(`${API_BASE}/api/stripe/confirm-payment`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ paymentIntentId: paymentIntent.id })
                    });

                    // Show success
                    document.getElementById('payment-section').innerHTML = `
                        <h2 style="color: #28a745;">✅ Payment Successful!</h2>
                        <p style="color: #333;">Your order has been placed successfully.</p>
                        <a href="orders.html" style="display: inline-block; margin-top: 20px; padding: 15px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 10px; font-weight: 600;">View Orders</a>
                    `;
                }
            } catch (err) {
                console.error('Payment error:', err);
                messageDiv.textContent = 'An unexpected error occurred.';
                messageDiv.className = 'error';
                submitButton.disabled = false;
                submitButton.textContent = 'Pay Now';
            }
        });

        // Cancel button
        document.getElementById('cancel-payment').onclick = () => {
            document.getElementById('payment-section').style.display = 'none';
            document.getElementById('products-section').style.display = 'grid';
        };

        // handleSubscribe for subscription
        document.getElementById('subscribe-now').onclick = handleSubscribe;

        async function handleSubscribe() {
            const statusEl = document.getElementById('sub-payment-status');
            const quantity = parseInt(document.getElementById('sub-quantity').value);
            const duration = parseInt(document.getElementById('sub-duration').value);
            if (quantity < 1 || quantity > 1000 || duration < 1 || duration > 36) {
                statusEl.innerHTML = '<div style="color: red;">Invalid quantity (1-1000) or duration (1-36)</div>';
                return;
            }
            // Core subscription logic (fetch to create-subscription-payment) follows here
        }
    </script>
</body>

</html>
