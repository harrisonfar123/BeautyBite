<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBite Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body.gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }

        #back-shop {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 600;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        #back-shop:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .user-name {
            font-weight: 600;
            font-size: 1.2em;
        }

        #logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        #logout:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .section {
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .section h2 {
            font-size: 2em;
            margin-bottom: 30px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        thead th {
            background: rgba(255, 255, 255, 0.25);
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 1.1em;
        }

        tbody td {
            padding: 18px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.9);
            color: white;
        }

        .status-scheduled {
            background: rgba(33, 150, 243, 0.9);
            color: white;
        }

        .status-fulfilled {
            background: rgba(76, 175, 80, 0.9);
            color: white;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.9);
            color: white;
        }

        .details-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .details-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
        }

        .empty-state a {
            color: #FFD700;
            text-decoration: none;
            font-weight: 600;
        }

        .deliveries-nested {
            margin-top: 10px;
            padding-left: 20px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .header-left {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .header h1 {
                font-size: 2em;
            }

            .section {
                padding: 20px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            thead th,
            tbody td {
                min-width: 100px;
                padding: 12px 8px;
                font-size: 0.9em;
            }
        }

        .subscription-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-success { background-color: #28a745; }
        .status-danger { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; color: black; }
        .status-complete { background-color: #17a2b8; }
    </style>
</head>

<body class="gradient-bg">
    <div class="header">
        <div class="header-left">
            <h1>Order History</h1>
            <a id="back-shop" href="shop.html">← Back to Shop</a>
        </div>
        <span class="user-name">Guest</span>
        <button id="logout">Logout</button>
    </div>
    <main>
        <div id="orders-section" class="section">
            <h2>All Orders</h2>
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="deliveries-section" class="section" style="display: none;">
            <h2>Scheduled Deliveries</h2>
            <table id="deliveries-table">
                <thead>
                    <tr>
                        <th>Delivery Date</th>
                        <th>Quantity</th>
                        <th>Status</th>
                        <th>Fulfilled Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <script>
        // Always use Heroku backend
        const API_BASE = 'https://beautybite-36e5434be6c8.herokuapp.com';
        const token = localStorage.getItem('token');

        // Better error handling for user data
        let user = {};
        try {
            user = JSON.parse(localStorage.getItem('user') || '{}');
        } catch (e) {
            console.error('Error parsing user data:', e);
        }

        // Only redirect if NO token exists
        if (!token) {
            console.log('No token found, redirecting to login');
            window.location.href = 'login.html';
        }

        document.querySelector('.user-name').textContent = user.name || 'User';
        document.getElementById('logout').onclick = () => { localStorage.clear(); location.href = 'login.html'; };

        function formatDate(dateString) {
            if (!dateString) return '-';
            return new Date(dateString).toLocaleDateString();
        }

        function formatAmount(amount) {
            return amount ? '$' + parseFloat(amount).toLocaleString() : '-';
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${API_BASE}/api/orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const orders = await res.json();

                const tbody = document.querySelector('#orders-table tbody');
                tbody.innerHTML = '';

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No orders yet. <a href="shop.html">Shop now</a></td></tr>';
                    return;
                }

                orders.forEach(order => {
                    const tr = document.createElement('tr');

                    // Date
                    const dateTd = document.createElement('td');
                    dateTd.textContent = formatDate(order.created_at);
                    tr.appendChild(dateTd);

                    // Type
                    const typeTd = document.createElement('td');
                    if (order.product_type === 'one-time') {
                        typeTd.textContent = 'One-Time';
                    } else if (order.product_type === 'recurring') {
                        typeTd.textContent = 'Recurring Order';
                    } else {
                        typeTd.textContent = order.product_type;
                    }
                    tr.appendChild(typeTd);

                    // Quantity
                    const qtyTd = document.createElement('td');
                    qtyTd.textContent = order.quantity || '-';
                    tr.appendChild(qtyTd);

                    // Amount
                    const amountTd = document.createElement('td');
                    amountTd.textContent = formatAmount(order.amount);
                    tr.appendChild(amountTd);

                    // Status
                    const statusTd = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = `status status-${order.status.toLowerCase()}`;
                    badge.textContent = order.status.toUpperCase();
                    statusTd.appendChild(badge);
                    tr.appendChild(statusTd);

                    // Details button
                    const detailsTd = document.createElement('td');
                    const btn = document.createElement('button');
                    btn.className = 'details-btn';
                    btn.textContent = 'Details';
                    btn.onclick = () => showOrderDetails(order);
                    detailsTd.appendChild(btn);
                    tr.appendChild(detailsTd);

                    tbody.appendChild(tr);
                });

            } catch (e) {
                console.error('Error loading orders:', e);
            }
        }

        async function loadDeliveries() {
            try {
                const res = await fetch(`${API_BASE}/api/deliveries`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const deliveries = await res.json();

                if (!deliveries || deliveries.length === 0) {
                    return; // Hide deliveries section if none exist
                }

                // Show deliveries section
                document.getElementById('deliveries-section').style.display = 'block';

                const tbody = document.querySelector('#deliveries-table tbody');
                tbody.innerHTML = '';

                deliveries.forEach(delivery => {
                    const tr = document.createElement('tr');

                    // Delivery Date
                    const dateTd = document.createElement('td');
                    dateTd.textContent = formatDate(delivery.delivery_date);
                    tr.appendChild(dateTd);

                    // Quantity
                    const qtyTd = document.createElement('td');
                    qtyTd.textContent = delivery.quantity;
                    tr.appendChild(qtyTd);

                    // Status
                    const statusTd = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = `status status-${delivery.status.toLowerCase()}`;
                    badge.textContent = delivery.status.toUpperCase();
                    statusTd.appendChild(badge);
                    tr.appendChild(statusTd);

                    // Fulfilled Date
                    const fulfilledTd = document.createElement('td');
                    fulfilledTd.textContent = formatDate(delivery.fulfilled_at);
                    tr.appendChild(fulfilledTd);

                    tbody.appendChild(tr);
                });

            } catch (e) {
                console.error('Error loading deliveries:', e);
            }
        }

        function showOrderDetails(order) {
            let details = `Order ID: ${order.id}\n`;
            details += `Date: ${formatDate(order.created_at)}\n`;
            details += `Type: ${order.product_type}\n`;
            details += `Quantity: ${order.quantity}\n`;
            details += `Amount: ${formatAmount(order.amount)}\n`;
            details += `Status: ${order.status}\n`;
            if (order.stripe_payment_intent_id) {
                details += `\nPayment ID: ${order.stripe_payment_intent_id}`;
            }
            alert(details);
        }

        // Load data on page load
        window.addEventListener('load', () => {
            loadOrders();
            loadDeliveries();
        });
    </script>
</body>

</html>
