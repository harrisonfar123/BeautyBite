<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBite - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .dashboard-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #loading {
            font-size: 1.3em;
            color: #666;
            padding: 20px;
        }

        #welcome-section {
            display: none;
        }

        #welcome-section h1 {
            font-size: 2.8em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 300;
        }

        #user-name {
            color: #333;
            font-weight: 600;
        }

        #logout-btn {
            display: none;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2);
        }

        #logout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);
        }

        #logout-btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 40px 30px;
                margin: 10px;
            }

            #welcome-section h1 {
                font-size: 2.2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="dashboard-container">
            <div id="loading">Verifying your session...</div>
            <h1 id="welcome-section">
                Welcome back, <span id="user-name"></span>!
            </h1>
            <button id="logout-btn">Logout</button>
            <!-- Add this after the "Welcome [name]!" section -->
            <div class="navigation-buttons"
                style="margin-top: 30px; display: flex; gap: 15px; justify-content: center;">
                <a href="shop.html"
                    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: transform 0.2s;">
                    🛒 Go to Shop
                </a>
                <a href="orders.html"
                    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: transform 0.2s;">
                    📦 View Orders
                </a>
            </div>

            <style>
                .navigation-buttons a:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
                }
            </style>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                console.log('No credentials found, redirecting to login');
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);
            const loadingEl = document.getElementById('loading');
            const welcomeSection = document.getElementById('welcome-section');
            const userNameEl = document.getElementById('user-name');
            const logoutBtn = document.getElementById('logout-btn');

            userNameEl.textContent = user.name || 'User';

            try {
                console.log('Verifying token for user:', user.name);
                const response = await fetch('https://beautybite-36e5434be6c8.herokuapp.com/api/auth/verify', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                console.log('Verify response status:', response.status, 'data:', data);

                if (response.ok) {
                    loadingEl.style.display = 'none';
                    welcomeSection.style.display = 'block';
                    logoutBtn.style.display = 'inline-block';
                } else {
                    throw new Error(data.error || data.message || 'Token verification failed');
                }
            } catch (error) {
                console.error('Verification error:', error);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                loadingEl.textContent = 'Session expired or invalid. Redirecting to login...';
                loadingEl.style.color = '#721c24';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }

            logoutBtn.addEventListener('click', function (e) {
                e.preventDefault();
                console.log('Logging out user:', user.name);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            });
        });
    </script>
</body>

</html>
