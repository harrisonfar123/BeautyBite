<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBite - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFE4E1 50%, #FFFFFF 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem 2.5rem;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        header h1 {
            color: #FF69B4;
            font-weight: 300;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        #welcome {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .logout-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.5);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FFB6C1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .error {
            background: #ffebee;
            color: #d32f2f;
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
            border: 1px solid #f44336;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2.5rem 2rem;
                margin: 1rem;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>BeautyBite</h1>
        </header>
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>
        <div id="dashboard" class="hidden">
            <div id="welcome">Loading...</div>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
        <div id="errorMsg" class="error"></div>
    </div>
    <script>
        async function verifyToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/verify', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                    },
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('welcome').textContent = `Welcome, ${data.user.name}!`;
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                } else {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Verify error:', error);
                localStorage.removeItem('token');
                document.getElementById('errorMsg').textContent = 'Session expired or server error. Redirecting to login...';
                document.getElementById('errorMsg').style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });

        window.addEventListener('load', verifyToken);
    </script>
</body>

</html>
