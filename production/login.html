<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBite - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFE4E1 50%, #FFFFFF 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        header h1 {
            color: #FF69B4;
            font-weight: 300;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .toggle-container {
            display: flex;
            margin-bottom: 2rem;
            border-radius: 50px;
            overflow: hidden;
            background: #f8f9fa;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .toggle-btn {
            flex: 1;
            padding: 1rem 0.5rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #6c757d;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            color: white;
            box-shadow: inset 0 -3px 10px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input {
            width: 100%;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: rgba(255, 255, 255, 0.8);
        }

        input:focus {
            outline: none;
            border-color: #FFB6C1;
            box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.1);
        }

        button {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .error {
            background: #ffebee;
            color: #d32f2f;
            border: 1px solid #f44336;
        }

        .success {
            background: #e8f5e8;
            color: #388e3c;
            border: 1px solid #4caf50;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>BeautyBite</h1>
        </header>
        <div class="toggle-container">
            <button id="loginToggle" class="toggle-btn active">Login</button>
            <button id="registerToggle" class="toggle-btn">Register</button>
        </div>
        <div id="loginForm" class="form-container active">
            <form id="loginFormEl">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>
        <div id="registerForm" class="form-container">
            <form id="registerFormEl">
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                <button type="submit">Register</button>
            </form>
            <div id="regMessage" class="message"></div>
        </div>
    </div>
    <script>
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function showMessage(id, message, type) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.className = `message ${type}`;
            el.style.display = 'block';
        }

        function clearMessages() {
            document.getElementById('loginMessage').style.display = 'none';
            document.getElementById('regMessage').style.display = 'none';
        }

        // Toggle forms
        document.getElementById('loginToggle').addEventListener('click', () => {
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('registerForm').classList.remove('active');
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('loginToggle').classList.add('active');
            clearMessages();
        });

        document.getElementById('registerToggle').addEventListener('click', () => {
            document.getElementById('registerForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('registerToggle').classList.add('active');
            clearMessages();
        });

        // Login
        document.getElementById('loginFormEl').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!validateEmail(email)) {
                showMessage('loginMessage', 'Please enter a valid email address.', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('loginMessage', 'Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    showMessage('loginMessage', data.error || 'Login failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('loginMessage', 'Network error. Make sure the server is running on localhost:3000.', 'error');
            }
        });

        // Register
        document.getElementById('registerFormEl').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!name || name.length < 2) {
                showMessage('regMessage', 'Full name must be at least 2 characters.', 'error');
                return;
            }
            if (!validateEmail(email)) {
                showMessage('regMessage', 'Please enter a valid email address.', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('regMessage', 'Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('regMessage', 'Passwords do not match.', 'error');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password }),
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage('regMessage', 'Registration successful! You can now login.', 'success');
                    // Optionally auto switch to login
                    document.getElementById('loginToggle').click();
                } else {
                    showMessage('regMessage', data.error || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Register error:', error);
                showMessage('regMessage', 'Network error. Make sure the server is running on localhost:3000.', 'error');
            }
        });
    </script>
</body>

</html>
